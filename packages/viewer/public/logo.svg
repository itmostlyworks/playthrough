<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Playthrough</title>
  <!-- The round before and the next, side by side, and a note over where they meet, in the viewer's own colours. -->
  <style>
    .round { fill: #2b2e35; }
    .note { fill: #d9a23a; }
    @media (prefers-color-scheme: dark) {
      .round { fill: #e3e4e7; }
      .note { fill: #e2b04f; }
    }
  </style>
  <mask id="around-the-note">
    <rect width="32" height="32" fill="#fff" />
    <circle cx="16" cy="16" r="7" fill="#000" />
  </mask>
  <g mask="url(#around-the-note)">
    <rect class="round" x="2" y="6" width="12" height="20" rx="3" opacity="0.35" />
    <rect class="round" x="18" y="6" width="12" height="20" rx="3" />
  </g>
  <circle class="note" cx="16" cy="16" r="5" />
</svg>
